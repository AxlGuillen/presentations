<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El programa · Presentaciones con IA</title>
<meta name="description" content="El programa: presentaciones web hechas con IA. Decks interactivos que se navegan con teclado o táctil, con modo presentación, exportación a PDF y videos narrados.">
<meta property="og:type" content="website">
<meta property="og:title" content="El programa · Presentaciones hechas con IA">
<meta property="og:description" content="Decks web interactivos: se navegan con teclado o táctil, tienen modo presentación, se exportan a PDF y se comparten con un simple enlace.">
<meta property="og:url" content="https://presentations-three-phi.vercel.app/">
<meta property="og:image" content="https://presentations-three-phi.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── La cartelera · línea de diseño en docs/linea-diseno-galeria.md ── */
  :root {
    --tinta: #16130E;
    --papel: #EDE8DD;
    --humo: #8F887A;
    --linea: #2C2822;
    --lampara: #E8B54D;
    --deck-acento: #E8B54D;      /* lo pisa el deck activo */
    --deck-glow: 232, 181, 77;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--tinta);
    color: var(--papel);
    font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: 'Spline Sans Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--lampara); outline-offset: 3px; border-radius: 2px; }

  .escenario { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); min-height: 100vh; }

  /* ── Pantalla de proyección ─────────────────────────────────────── */
  .pantalla {
    position: relative; overflow: hidden; background: #0B0906;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 46px 56px 40px; min-height: 100vh;
  }
  .pantalla .fondo {
    position: absolute; inset: 0; background-size: cover; background-position: center 22%;
    opacity: 0; transition: opacity 600ms ease; filter: saturate(0.96);
  }
  .pantalla .fondo.activa { opacity: 1; }
  .pantalla .velo {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(11, 9, 6, 0.30) 0%, rgba(11, 9, 6, 0.66) 52%, rgba(11, 9, 6, 0.97) 100%);
  }
  .pantalla .brillo {
    position: absolute; inset: 0; pointer-events: none; transition: background 500ms ease;
    background: radial-gradient(115% 75% at 45% 32%, rgba(var(--deck-glow), 0.22) 0%, rgba(0, 0, 0, 0) 65%);
  }
  .pantalla .contenido { position: relative; z-index: 2; }
  .marca-4xl {
    position: absolute; right: -36px; bottom: -26px; width: 320px; height: auto;
    color: var(--papel); opacity: 0.045; z-index: 1; pointer-events: none;
    transition: color 500ms ease;
  }

  .senal { position: absolute; top: 38px; left: 56px; z-index: 3; display: flex; align-items: center; gap: 12px; }
  .senal .punto { width: 8px; height: 8px; border-radius: 50%; background: var(--lampara); box-shadow: 0 0 12px rgba(232, 181, 77, 0.8); }
  .senal .txt { font-size: 11px; letter-spacing: 2.5px; color: var(--lampara); }

  .navegacion { position: absolute; top: 32px; right: 56px; z-index: 3; display: flex; align-items: center; gap: 16px; }
  .navegacion .contador { font-size: 12px; color: var(--humo); }
  .navegacion button {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1;
    background: transparent; border: 1px solid #3A332A; color: var(--humo);
    transition: border-color 150ms ease, color 150ms ease;
  }
  .navegacion button:hover { border-color: rgba(232, 181, 77, 0.7); color: var(--lampara); }

  .chip-serie {
    display: inline-flex; align-self: flex-start; align-items: center; border-radius: 999px;
    padding: 7px 16px; margin-bottom: 20px; border: 1px solid var(--deck-acento);
    font-size: 10px; letter-spacing: 2px; color: var(--deck-acento);
    transition: border-color 400ms ease, color 400ms ease;
  }
  .barra-acento { width: 48px; height: 5px; background: var(--deck-acento); margin-bottom: 18px; transition: background 400ms ease; }
  .pantalla h1 {
    margin: 0; font-family: 'Bricolage Grotesque', 'Arial Black', sans-serif; font-weight: 800; font-style: italic;
    font-size: clamp(44px, 6.2vw, 92px); line-height: 0.92; text-transform: uppercase; text-wrap: balance;
    color: #F7F2E9; text-shadow: 0 0 70px rgba(var(--deck-glow), 0.35);
  }
  .pantalla .descripcion { margin: 18px 0 0; font-size: 17px; font-weight: 500; color: var(--papel); opacity: 0.85; max-width: 540px; line-height: 1.5; }
  .acciones { margin-top: 28px; display: flex; align-items: center; flex-wrap: wrap; gap: 18px; }
  .abrir {
    display: inline-block; font-family: 'Spline Sans Mono', monospace; font-size: 12px; letter-spacing: 1px;
    color: var(--tinta); background: var(--lampara); border-radius: 999px; padding: 13px 26px; font-weight: 500;
    transition: transform 150ms ease, box-shadow 150ms ease;
  }
  .abrir:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(232, 181, 77, 0.25); }
  .acciones .meta { font-size: 12px; color: var(--humo); }

  .progreso { margin-top: 34px; display: flex; gap: 7px; }
  .progreso span { width: 22px; height: 3px; background: #3A332A; transition: width 350ms ease, background 350ms ease; }
  .progreso span.activa { width: 44px; background: var(--deck-acento); }

  /* ── El índice ──────────────────────────────────────────────────── */
  .indice { display: flex; flex-direction: column; padding: 34px 44px 24px; min-height: 100vh; }
  .cabecera { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--linea); }
  .cabecera .marca { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .cabecera h2 { margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; color: var(--papel); }
  .cabecera .sub { font-size: 10px; letter-spacing: 1.5px; color: var(--humo); }
  .cabecera .cuenta { font-size: 11px; color: var(--humo); white-space: nowrap; }

  .filas { flex: 1; display: flex; flex-direction: column; }
  .grupo {
    display: flex; align-items: baseline; gap: 12px; padding: 16px 8px 7px;
    border-bottom: 1px solid var(--linea);
  }
  .grupo:first-child { padding-top: 8px; }
  .grupo .nombre { font-size: 11px; letter-spacing: 2.5px; color: var(--lampara); }
  .grupo .regla { flex: 1; height: 1px; background: var(--linea); }
  .grupo .n { font-size: 11px; color: var(--humo); }
  .fila {
    display: flex; flex-direction: column; gap: 3px; padding: 10px 8px;
    border-bottom: 1px solid var(--linea); border-radius: 3px; cursor: pointer;
    transition: background 250ms ease;
  }
  .fila .linea1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .fila .titulo { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 19px; color: var(--papel); transition: color 250ms ease; }
  .fila .extra { font-size: 10px; color: var(--lampara); white-space: nowrap; }
  .fila .datos { font-size: 10px; letter-spacing: 1px; color: var(--humo); text-transform: uppercase; }
  .fila .en-pantalla { display: none; font-size: 10px; white-space: nowrap; }
  .fila.activa { background: rgba(var(--deck-glow), 0.09); border-bottom-color: var(--deck-acento); }
  .fila.activa .titulo { color: var(--deck-acento); font-weight: 800; }
  .fila.activa .datos { color: var(--papel); }
  .fila.activa .en-pantalla { display: inline; color: var(--deck-acento); }
  .fila:hover:not(.activa) { background: rgba(237, 232, 221, 0.04); }

  .pie { padding-top: 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 14px; border-top: 1px solid var(--linea); margin-top: 8px; }
  .pie .invita { font-size: 12.5px; color: var(--humo); }
  .pie .cta { font-size: 11px; color: var(--lampara); white-space: nowrap; }
  .pie .cta:hover { color: var(--papel); }

  /* ── Entrada ────────────────────────────────────────────────────── */
  @media (prefers-reduced-motion: no-preference) {
    .fila { opacity: 0; transform: translateY(10px); animation: llega 500ms cubic-bezier(0.22, 0.61, 0.36, 1) forwards; }
    .pantalla .contenido { animation: llega 700ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    @keyframes llega { to { opacity: 1; transform: none; } }
  }

  /* ── Móvil ──────────────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .escenario { grid-template-columns: 1fr; min-height: 0; }
    .pantalla { min-height: 0; height: 480px; margin: 12px; border-radius: 14px; padding: 20px; }
    .senal { top: 16px; left: 20px; }
    .navegacion { top: 12px; right: 14px; }
    .pantalla h1 { font-size: clamp(36px, 10vw, 52px); }
    .marca-4xl { width: 180px; right: -24px; bottom: -18px; }
    .pantalla .descripcion { font-size: 14px; }
    .indice { min-height: 0; padding: 18px 20px 20px; }
    .fila .titulo { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="escenario">

  <section class="pantalla" aria-label="En cartelera">
    <div class="fondo" id="fondo-a"></div>
    <div class="fondo" id="fondo-b"></div>
    <div class="velo"></div>
    <div class="brillo"></div>
    <svg class="marca-4xl" viewBox="0 0 104 92" fill="currentColor" aria-hidden="true">
      <path d="M0 52 H104 V66 H0 Z"></path>
      <path d="M66 0 H80 V78 H104 V92 H66 V20 L26 60 H6 Z"></path>
    </svg>

    <div class="senal"><span class="punto"></span><span class="txt mono">EN CARTELERA</span></div>
    <div class="navegacion">
      <span class="contador mono" id="contador">01 / 10</span>
      <button type="button" id="anterior" aria-label="Anterior">‹</button>
      <button type="button" id="siguiente" aria-label="Siguiente">›</button>
    </div>

    <div class="contenido">
      <span class="chip-serie mono" id="chip-serie">SERIE</span>
      <div class="barra-acento"></div>
      <h1 id="titulo-pantalla">—</h1>
      <p class="descripcion" id="descripcion-pantalla"></p>
      <div class="acciones">
        <a class="abrir" id="abrir-pantalla" href="#">ABRIR PRESENTACIÓN →</a>
        <span class="meta mono" id="meta-pantalla"></span>
      </div>
      <div class="progreso" id="progreso" aria-hidden="true"></div>
    </div>
  </section>

  <section class="indice" aria-label="El programa">
    <header class="cabecera">
      <div class="marca">
        <h2>El programa</h2>
        <span class="sub mono">PRESENTACIONES HECHAS CON IA</span>
      </div>
      <span class="cuenta mono" id="cuenta">10 PRESENTACIONES</span>
    </header>

    <div class="filas" id="filas"></div>

    <footer class="pie">
      <span class="invita">¿Quieres una para tu marca? Cada deck se entrega como enlace listo para compartir.</span>
      <a class="cta mono" href="https://github.com/AxlGuillen/presentations" rel="noopener">VER EL MAKING-OF →</a>
    </footer>
  </section>

</div>

<script>
// ── El programa: datos reales de cada deck ─────────────────────────
// acento/glow: la paleta del deck tiñe la página cuando está en pantalla.
const DECKS = [
  { grupo: 'Profesional', ruta: 'tabletas/', titulo: 'Comparativo Tabletas Rugged', serie: 'COMERCIAL · DYMMSA', datos: 'COMERCIAL · 16:9 · 22 DIAP · JUL 26', meta: '16:9 · 22 DIAPOSITIVAS · JUL 2026',
    desc: '14 tabletas rugged en tres rangos de precio, con puntuaciones para público no técnico y recomendación final.', acento: '#E05A64', glow: '195, 23, 34' },
    { grupo: 'Profesional', ruta: 'estancia/', titulo: 'Propuesta · La Casita Feliz', serie: 'COMERCIAL · CAI', datos: 'COMERCIAL · 16:9 · 10 DIAP · AGO 26', meta: '16:9 · 10 DIAPOSITIVAS · AGO 2026',
    desc: 'Web, redes sociales y sistema de administración para una estancia infantil — propuesta integral de dos especialistas.', acento: '#E94B85', glow: '233, 75, 133' },
    { grupo: 'Profesional', ruta: 'semana34/', titulo: 'Semana 34 · Reporte semanal Jira', serie: 'INTERNO · DATA', datos: 'INTERNO · DATA · 16:9 · 8 DIAP · GSAP', meta: '16:9 · 8 DIAPOSITIVAS · AGO 2026',
    desc: 'El reporte semanal del equipo con animación GSAP renderizable cuadro a cuadro.', acento: '#4C9AFF', glow: '76, 154, 255' },
    { grupo: 'Creador de contenido', ruta: 'soloq/', titulo: 'SoloQ Challenge · Premios vs salario mínimo', serie: 'ESPORTS · DATA', datos: 'ESPORTS · DATA · 9:16 · 28 DIAP · AGO 26', meta: '9:16 · 28 DIAPOSITIVAS · AGO 2026',
    desc: '125 000 € en premios traducidos a días de salario mínimo en México, Chile, Colombia y Argentina.', acento: '#53FC18', glow: '83, 252, 24' },
    { grupo: 'Creador de contenido', ruta: 'lowelo/', titulo: 'Low Elo vs High Elo · El corte por LP', serie: 'ESPORTS · DATA', datos: 'ESPORTS · DATA · 9:16 · 7 DIAP · AGO 26', meta: '9:16 · 7 DIAPOSITIVAS · AGO 2026',
    desc: 'La distribución de rangos como campana y como edificio, y el camino Hierro→Challenger a escala real.', acento: '#C89B3C', glow: '200, 155, 60' },
    { grupo: 'Creador de contenido', ruta: 'ornn/', titulo: 'Ornn cumple 9 años', serie: 'CUMPLELOLERO · 01', datos: 'CUMPLELOLERO 01 · 9:16 · 8 DIAP · AGO 26', meta: '9:16 · 8 DIAPOSITIVAS · AGO 2026',
    desc: 'El one trick de 7 millones de puntos, la sequía de skins y la forja de Hefesto — apoyo visual para video vertical.', acento: '#FF6B1A', glow: '255, 107, 26' },
    { grupo: 'Creador de contenido', ruta: 'urgot/', titulo: 'Urgot cumple 16 años', serie: 'CUMPLELOLERO · 02', datos: 'CUMPLELOLERO 02 · 9:16 · 5 DIAP · AGO 26', meta: '9:16 · 5 DIAPOSITIVAS · AGO 2026',
    desc: 'El rework que lo salvó, la sequía de seis años y medio sin skins y el verdugo que acabó del lado del condenado.', acento: '#96E32E', glow: '150, 227, 46' },
    { grupo: 'Creador de contenido', ruta: 'talon/', titulo: 'Talon cumple 15 años', serie: 'CUMPLELOLERO · 03', datos: 'CUMPLELOLERO 03 · 9:16 · 7 DIAP · AGO 26', meta: '9:16 · 7 DIAPOSITIVAS · AGO 2026',
    desc: 'El top mundial lleno de latinos y el salto de paredes que lo define desde 2017.', acento: '#6FC7F0', glow: '111, 199, 240' },
    { grupo: 'Creador de contenido', ruta: 'skins/', titulo: 'Los campeones con más skins', serie: 'DATOS CURIOSOS · 01', datos: 'DATOS CURIOSOS 01 · 9:16 · 4 DIAP · AGO 26', meta: '9:16 · 4 DIAPOSITIVAS · AGO 2026',
    desc: 'El triple empate que se rompe al descontar bóveda y prestigio, con los collages completos de Lux, Ahri y MF.', acento: '#E75FB4', glow: '231, 95, 180' },
    { grupo: 'Creador de contenido', ruta: 'caras/', titulo: 'Las skins más caras del LoL', serie: 'DATOS CURIOSOS · 02', datos: 'DATOS CURIOSOS 02 · 9:16 · 5 DIAP · AGO 26', meta: '9:16 · 5 DIAPOSITIVAS · AGO 2026',
    desc: 'De 25 a 450 dólares en un solo año: exaltadas, trascendentes y el tarjetazo del Hall of Legends.', acento: '#F5C042', glow: '245, 192, 66' },
];

const portada = d => 'portadas/' + d.ruta.replace('/', '') + '.jpg';
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// precarga suave de portadas
DECKS.forEach(d => { const im = new Image(); im.src = portada(d); });

// ── construir el índice ────────────────────────────────────────────
const filas = document.getElementById('filas');
const filasDeck = [];   // solo las filas de deck: los encabezados de grupo NO cuentan
let grupoActual = null;
DECKS.forEach((d, i) => {
  if (d.grupo !== grupoActual) {
    grupoActual = d.grupo;
    const n = DECKS.filter(x => x.grupo === d.grupo).length;
    const h = document.createElement('div');
    h.className = 'grupo mono';
    h.innerHTML = '<span class="nombre">' + d.grupo.toUpperCase() + '</span><span class="regla"></span><span class="n">' + n + '</span>';
    filas.appendChild(h);
  }
  const a = document.createElement('a');
  a.className = 'fila';
  a.href = d.ruta;
  a.style.animationDelay = (i * 45) + 'ms';
  a.innerHTML =
    '<span class="linea1"><span class="titulo">' + d.titulo + '</span>' +
    (d.video ? '<span class="extra mono">' + d.video + '</span>' : '<span class="en-pantalla mono">EN PANTALLA ◄</span>') +
    '</span>' +
    '<span class="datos mono">' + d.datos + '</span>';
  a.addEventListener('mouseenter', () => proyectar(i, true));
  a.addEventListener('focus', () => proyectar(i, true));
  filas.appendChild(a);
  filasDeck.push(a);
});

document.getElementById('cuenta').textContent =
  DECKS.filter(d => d.grupo === 'Profesional').length + ' PROFESIONAL · ' +
  DECKS.filter(d => d.grupo === 'Creador de contenido').length + ' CONTENIDO';

const progreso = document.getElementById('progreso');
DECKS.forEach(() => progreso.appendChild(document.createElement('span')));

// ── la proyección ──────────────────────────────────────────────────
const fondos = [document.getElementById('fondo-a'), document.getElementById('fondo-b')];
let fondoVisible = 0;
let actual = -1;
let temporizador = null;

function proyectar(i, manual) {
  if (i === actual) { if (manual) reiniciarRotacion(); return; }
  actual = i;
  const d = DECKS[i];

  // crossfade de portada entre dos capas
  const entra = fondos[1 - fondoVisible], sale = fondos[fondoVisible];
  entra.style.backgroundImage = 'url("' + portada(d) + '")';
  entra.classList.add('activa');
  sale.classList.remove('activa');
  fondoVisible = 1 - fondoVisible;

  // tinte de página
  document.documentElement.style.setProperty('--deck-acento', d.acento);
  document.documentElement.style.setProperty('--deck-glow', d.glow);

  document.getElementById('chip-serie').textContent = 'SERIE ' + d.serie;
  document.getElementById('titulo-pantalla').textContent = d.titulo;
  document.getElementById('descripcion-pantalla').textContent = d.desc;
  document.getElementById('abrir-pantalla').href = d.ruta;
  document.getElementById('meta-pantalla').textContent = d.meta;
  document.getElementById('contador').textContent = String(i + 1).padStart(2, '0') + ' / ' + DECKS.length;

  [...progreso.children].forEach((s, j) => s.classList.toggle('activa', j === i));
  filasDeck.forEach((f, j) => f.classList.toggle('activa', j === i));

  if (manual) reiniciarRotacion();
}

function siguiente(paso) { proyectar((actual + paso + DECKS.length) % DECKS.length, false); }
document.getElementById('siguiente').addEventListener('click', () => { siguiente(1); reiniciarRotacion(); });
document.getElementById('anterior').addEventListener('click', () => { siguiente(-1); reiniciarRotacion(); });

function reiniciarRotacion() {
  if (temporizador) clearInterval(temporizador);
  if (reduceMotion) return; // sin rotación automática
  temporizador = setInterval(() => siguiente(1), 7000);
}

proyectar(0, false);
reiniciarRotacion();
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (temporizador) clearInterval(temporizador); }
  else reiniciarRotacion();
});
</script>
</body>
</html>
