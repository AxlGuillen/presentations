      hechos.push({ el: p.el, modos: modos });
    });
    return hechos;
  };

  // ── API ────────────────────────────────────────────────────────────────
  var NUM =/^-?\d+(\.\d+)?$/;
  function leer(el) {
    var o = {}, d = el.dataset;
    for (var k in d) {
      if (k === 'efecto') continue;
      var v = d[k];
      o[k] = NUM.test(v) ? parseFloat(v) : v;
    }
    return o;
  }
  // PRNG con semilla para coreografías propias (nunca Math.random: rompe el render cuadro a cuadro)
  window.random = prng;
  // Recetas que suenan en el video: video.mjs pone su efecto (whoosh, golpe,
  // ticks o pop) donde la timeline lleva la etiqueta sfx:<receta>. El momento
  // es el primer cuadro en que se ve lo que suena: el arranque de la receta,
  // salvo el sello, que suena al caer. data-sfx="no" la deja muda.
  var SFX = { cortinilla: 0, lineas: 0, contador: 0, bento: 0, piezas: 0, palabra: 0, rayo: 0, impacto: 0, letrero: 0.16, dona: 0, derrumbe: 0,
    sello: function (o) { return o.dur || 0.42; }, multikill: function (o) { return o.dur || 0.42; } };
  window.sfx = function (tl, nombre, pos) {
    var base = 'sfx:' + nombre, n = 1, k = base;
    while (tl.labels[k] != null) k = base + '#' + (++n);   // addLabel con el mismo nombre pisaría el anterior
    tl.addLabel(k, pos);
    return tl;
  };
  window.efecto = function (nombre, tl, el, opciones) {
    if (!el) return tl;
    var f = R[nombre];
    if (!f) { console.warn('efecto desconocido:', nombre); return tl; }
    var o = opciones || {};
    f(tl, el, o);
    if (nombre in SFX && o.sfx !== 'no' && el.getClientRects().length) {
      var d = SFX[nombre];
      window.sfx(tl, nombre, (o.en || 0) + (typeof d === 'function' ? d(o) : d));
    }
    return tl;
  };
  window.efectosDeclarados = function (tl, s) {
    // La continuidad mide primero, antes de que las demás recetas apliquen sus from().
    var omitir = [];
    window.continua(tl, s).forEach(function (h) {
      h.modos.forEach(function (m) { if (SUSTITUYE[m]) omitir.push({ el: h.el, nombre: SUSTITUYE[m] }); });
    });
    lista(s.querySelectorAll('[data-efecto]')).forEach(function (el) {
      el.getAttribute('data-efecto').split(/\s+/).forEach(function (nombre) {
        var sustituida = omitir.some(function (x) { return x.nombre === nombre && (x.el === el || x.el.contains(el)); });
        if (!sustituida) window.efecto(nombre, tl, el, leer(el));
      });
    });
  };
  window.efectosDisponibles = Object.keys(R);
})();

<script>
(function () {
  if (!window.gsap) return;
  var reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var registro = {};
  window.animar = function (etiqueta, fn) { registro[etiqueta] = fn; };
  window.cuenta = function (tl, el, pos) {
    if (!el) return;
    var fin = parseFloat(el.dataset.cuenta), suf = el.dataset.sufijo || '';
    var o = { v: 0 };
    tl.to(o, { v: fin, duration: 1, ease: 'power2.out',
      onUpdate: function () { el.textContent = Math.round(o.v) + suf; } }, pos || 0);
    // Suena como la receta contador (ticks en el video), en el arranque real
    // del tween: pos puede ser relativa ('<', '+=0.2'). Sin kit.efectos() no
    // hay window.sfx y la etiqueta se pone aquí mismo.
    var en = tl.recent().startTime();
    if (window.sfx) window.sfx(tl, 'contador', en);
    else if (tl.labels['sfx:contador'] == null) tl.addLabel('sfx:contador', en);
  };
  function porDefecto(tl, s) {
    ['ghost', 'up', 'up2', 'up3'].forEach(function (n, i) {
      var els = s.querySelectorAll('[data-a="' + n + '"]');
      if (!els.length) return;
      if (n === 'ghost') tl.from(els, { scale: 0.88, opacity: 0, duration: 1 }, 0);
      else tl.from(els, { y: 26, opacity: 0, duration: 0.65 }, (i - 1) * 0.13);
    });
    // Recetas declaradas en el HTML (data-efecto), si el deck carga kit.efectos().
    if (window.efectosDeclarados) window.efectosDeclarados(tl, s);
  }
  function lanzar(s) {
    if (s.__tl) s.__tl.revert();
    // Lo que las recetas cambiaron del DOM (SplitText, cortinas, rebanadas…)
    // se deshace antes de reconstruir; si no, se partiría el texto dos veces.
    (s.__deshacer || []).reverse().forEach(function (f) { try { f(); } catch (e) {} });
    s.__deshacer = [];
    var tl = gsap.timeline({ defaults: { ease: 'power3.out' } });
    (registro[s.dataset.label] || porDefecto)(tl, s);
    if (reducido) tl.progress(1);
    s.__tl = tl;
  }
  function arrancar() {
    var ds = document.querySelector('deck-stage');
    if (!ds) return;
    var obs = new MutationObserver(function (ms) {
      ms.forEach(function (m) {
        if (m.target.hasAttribute('data-deck-active')) lanzar(m.target);
      });
    });
    ds.querySelectorAll(':scope > section').forEach(function (s) {
      obs.observe(s, { attributes: true, attributeFilter: ['data-deck-active'] });
    });
    // La primera lámina espera a las fuentes: SplitText mide las líneas, y con
    // la tipografía de respaldo saldrían cortes de línea distintos.
    var activa = ds.querySelector('section[data-deck-active]');
    if (activa) (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () {
      if (activa.hasAttribute('data-deck-active') && !activa.__tl) lanzar(activa);
    });
  }
  // Pasos (data-step de deck-stage): al revelar un paso hacia adelante, los
  // elementos recién visibles entran animados; ocultar o revelar de golpe
  // (llegar en reversa) no anima nada.
  document.addEventListener('stepchange', function (e) {
    var d = e.detail;
    if (reducido || !d || d.step !== d.previousStep + 1) return;
    var els = d.slide.querySelectorAll('[data-step="' + d.step + '"]');
    if (els.length) gsap.from(els, { y: 18, opacity: 0, duration: 0.45, stagger: 0.06, ease: 'power3.out', clearProps: 'opacity,transform' });
  });
  // Reconstruye la timeline de la lámina activa: lo usa el arranque de
  // three.js (kit.threeScript), que es un módulo y carga después.
  window.relanzar = function () {
    var a = document.querySelector('deck-stage > section[data-deck-active]');
    if (a) lanzar(a);
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar);
  else arrancar();
})();
</script>
<script>
(function () {
  if (!window.animar) return;
  var q = function (s, sel) { return s.querySelectorAll(sel); };

    });

  }

      .from(q(s, '[data-banda] rect'), { scaleX: 0, transformOrigin: '0% 50%', duration: 0.7, stagger: 0.1, ease: 'power3.inOut' }, 0.8)
      .from(q(s, '[data-emblema-eje]'), { scale: 0, transformOrigin: '50% 50%', opacity: 0, duration: 0.5, stagger: 0.1, ease: 'back.out(2.2)' }, 1.0)
      .from(q(s, '[data-anio]'), { opacity: 0, y: 10, duration: 0.4, stagger: 0.05 }, 1.1)
      .from(uno(s, '[data-linea]'), { drawSVG: '0%', duration: 1.5, ease: 'power1.inOut' }, 1.3)
      .from(q(s, '[data-punto]'), { scale: 0, transformOrigin: '50% 50%', duration: 0.3, ease: 'back.out(3)', stagger: 1.5 / ultimo }, 1.3)
      .from(uno(s, '[data-area]'), { opacity: 0, duration: 0.8 }, 2.4)

      .from(uno(s, '[data-gris]'), { filter: 'grayscale(0) brightness(1) contrast(1)', duration: 1.6, ease: 'power2.inOut' }, 0.7)
      .from(uno(s, '[data-tinte]'), { opacity: 0, duration: 1.6, ease: 'power2.inOut' }, 0.7)
      .from(uno(s, '[data-frio]'), { opacity: 0, duration: 1.6 }, 0.7)

      .from(uno(s, '[data-arte] [data-img]'), { scale: 1.12, duration: 3, ease: 'power2.out' }, 0);

  animar('lux-lobos', function (tl, s) {

<script>
(function () {
  var presenting = false;
  var btn = document.createElement('button');
  btn.id = 'modo-presentacion';
  btn.type = 'button';
  function render() {
    btn.textContent = presenting ? 'Salir · Esc' : 'Presentar · P';
    if (presenting) btn.setAttribute('data-on', ''); else btn.removeAttribute('data-on');
  }
  function setPresenting(on) {
    if (on === presenting) return;
    presenting = on;
    window.postMessage({ __omelette_presenting: on }, '*');
    if (on) {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
    } else if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
    render();
  }
  btn.addEventListener('click', function () { setPresenting(!presenting); btn.blur(); });
  window.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    if (e.key === 'p' || e.key === 'P') { setPresenting(!presenting); e.preventDefault(); }
    else if (e.key === 'Escape' && presenting && !document.fullscreenElement) setPresenting(false);
  });
  document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && presenting) setPresenting(false); });
  render();
  document.body.appendChild(btn);
})();
</script>
