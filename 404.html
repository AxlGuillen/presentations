<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · El programa</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Archivo:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* La cartelera (docs/linea-diseno-galeria.md): carbón, hueso y ámbar.
     No enlaza a ningún deck: la galería es privada y quien llega aquí suele
     traer un enlace incompleto. */
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px;
    background: #16130E; color: #EDE8DD; font-family: 'Archivo', ui-sans-serif, system-ui, sans-serif;
    background-image: radial-gradient(90% 55% at 50% 0%, rgba(232, 181, 77, 0.10) 0%, rgba(0, 0, 0, 0) 60%);
  }
  main { width: 100%; max-width: 520px; }
  .senal { display: flex; align-items: center; gap: 10px; font: 400 11px/1 'Spline Sans Mono', monospace; letter-spacing: 2.5px; color: #E8B54D; }
  .senal i { width: 8px; height: 8px; border-radius: 50%; background: #E8B54D; box-shadow: 0 0 12px rgba(232, 181, 77, 0.8); }
  .codigo {
    margin: 22px 0 0; font: italic 800 clamp(110px, 26vw, 200px)/0.86 'Bricolage Grotesque', 'Arial Black', sans-serif;
    letter-spacing: -6px; color: #F7F2E9; text-shadow: 0 0 70px rgba(232, 181, 77, 0.25);
  }
  h1 { margin: 22px 0 0; font: 800 30px/1.1 'Bricolage Grotesque', sans-serif; }
  p { margin: 14px 0 0; font-size: 16px; line-height: 1.6; color: #8F887A; }
  .acciones { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .acciones a {
    font: 500 12px/1 'Spline Sans Mono', monospace; letter-spacing: 1px; text-decoration: none;
    color: #16130E; background: #E8B54D; border-radius: 999px; padding: 14px 26px;
    transition: transform 150ms ease, box-shadow 150ms ease;
  }
  .acciones a:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(232, 181, 77, 0.25); }
  .marca { position: fixed; right: -30px; bottom: -22px; width: 260px; height: auto; color: #EDE8DD; opacity: 0.045; pointer-events: none; }
</style>
</head>
<body>
<main>
  <div class="senal"><i></i>FUERA DE CARTELERA</div>
  <p class="codigo">404</p>
  <h1>Esta función no existe</h1>
  <p>La dirección no lleva a ninguna presentación. Si te compartieron una, revisa que el enlace esté completo, con la barra del final.</p>
  <div class="acciones"><a href="/">IR A EL PROGRAMA →</a></div>
</main>
<svg class="marca" viewBox="0 0 104 92" fill="currentColor" aria-hidden="true"><path d="M0 52 H104 V66 H0 Z"></path><path d="M66 0 H80 V78 H104 V92 H66 V20 L26 60 H6 Z"></path></svg>
</body>
</html>
